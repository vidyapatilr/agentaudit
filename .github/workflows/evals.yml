name: Run Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentaudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run evals
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/agentaudit
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISABLE_TRACING: "true"
        run: uv run python -m evals.run_evals

      - name: Save results to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add evals/results.json
          git diff --staged --quiet || git commit -m "Update eval results [skip ci]"
          git push